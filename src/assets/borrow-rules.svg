<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">借用规则图解</title>
  <desc id="desc">多个只读引用可以同时存在，一个可变引用需要独占。</desc>
  <rect width="960" height="620" fill="#fffdf8"/>
  <text x="70" y="86" fill="#202124" font-family="Arial, sans-serif" font-size="38" font-weight="700">借用：看一眼或改一下</text>
  <g font-family="Arial, sans-serif">
    <rect x="90" y="150" width="780" height="150" rx="18" fill="#eef6f3" stroke="#d7dce2"/>
    <text x="122" y="206" fill="#246a73" font-size="28" font-weight="700">共享引用 &T</text>
    <circle cx="410" cy="230" r="28" fill="#ffffff" stroke="#246a73" stroke-width="3"/>
    <circle cx="500" cy="230" r="28" fill="#ffffff" stroke="#246a73" stroke-width="3"/>
    <circle cx="590" cy="230" r="28" fill="#ffffff" stroke="#246a73" stroke-width="3"/>
    <text x="382" y="278" fill="#5f6368" font-size="20">多人同时阅读</text>
    <rect x="90" y="350" width="780" height="150" rx="18" fill="#fff4e8" stroke="#d7dce2"/>
    <text x="122" y="406" fill="#b84526" font-size="28" font-weight="700">可变引用 &mut T</text>
    <circle cx="500" cy="430" r="34" fill="#ffffff" stroke="#b84526" stroke-width="4"/>
    <text x="452" y="482" fill="#5f6368" font-size="20">一人独占修改</text>
    <path d="M700 195l55 70M755 195l-55 70" stroke="#b84526" stroke-width="6" stroke-linecap="round"/>
    <text x="640" y="288" fill="#b84526" font-size="18">不能边多人读边修改</text>
  </g>
</svg>
